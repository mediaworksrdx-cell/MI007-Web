name: MI-007 Regression CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mi007-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run MI-007 & SMC Regression Suite
        run: npm run test:mi007
